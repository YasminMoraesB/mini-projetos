<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Cherry+Bomb+One&family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <h1>Calculadora de IMC</h1>
        <h3>Calcule seu indice corporal</h3>


        <section class="card-principal">
        <form>
            <!-- inputs -->
            <div class="inputs">
            <label for="peso">Peso</label>
            <input type="number" id="peso" placeholder="Digite seu peso">

            <label for="altura">Altura</label>
            <input type="number" id="altura" placeholder="Digite sua altura">
            </div>

            <!-- botão -->
            <button type="submit">Calcular</button>

            <!-- resultado -->

            <div class="resultado">
                <div class="informacoes-imc">
                <p>Peso digitado: </p> <span id="peso-digitado">0</span>
                <p>Altura digitada: </p> <span id="altura-digitada">0</span>
                </div>

                <div class="total-imc">
                <p>Seu imc é:</p> <span id="resultado-imc">0</span>
                </div>
                
                <div class="conteudo-imc">
                <span id="texto-com-base-imc"></span>
                </div>
            </div>
        </form>
    </section>

    </main>
</body>
</html>
