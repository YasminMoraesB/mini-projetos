    <!DOCTYPE html>
    <html lang="PT-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Cherry+Bomb+One&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="style.css">
        <title>Tela de cadastro</title>
    </head>
    <body>
    <div class="container">
        <div id="primeira-coluna">
            <div class="conteudo1">
            <img src="/Tela-de-login/teste.PNG" alt="Imagem do machta">
            <h1>Matcha Time</h1>
            <p>O sabor autêntico do matcha, direto na sua xícara.</p>
        </div>
        </div>
        
<div id="segunda-coluna">
    <form id="form-cadastro"> 
        <div class="conteudo2">
            <h1 id="coluna2">Crie uma conta</h1>
            
            <div id="criar-conta">
                <p>Já tem uma conta? Clique para </p>
                <strong><a href="#">entrar</a></strong> 
            </div>
            
            <div class="campo" id="input-nome">
                <p>Nome</p>
                <input type="text" id="nome" placeholder="Digite seu nome">
                <div id="erro-nome" class="erro"></div>
            </div>
            
            <div class="campo" id="input-email">
                <p>Email</p>
                <input type="email" id="email" placeholder="Digite seu email">
                <div id="erro-email" class="erro"></div>
            </div>

            <div class="campo" id="input-senha">
                <p>Senha</p>
                <input type="password" id="senha" placeholder="Digite sua senha">
                <div id="erro-senha" class="erro"></div>
            </div>
            
            <button type="submit" id="botao-senha">Criar conta</button>
        </div>
    </form> 
    
    <div class="icons">
        <p>Crie sua conta com:</p>
        <img src="/Tela-de-login/icons8-facebook-48.png" alt="Facebook">
        <img src="/Tela-de-login/icons8-google-logo-48.png" alt="Google">
        <img src="/Tela-de-login/icons8-linkedin-48.png" alt="Linkedin">
    </div>
</div>
    </body>
    <script src="script.js"></script>
    </html>
